# Production stack for the AWS Lightsail box (see DEPLOY.md).
# One instance runs everything: Postgres (pgvector) + Redis + API + Caddy (HTTPS).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Secrets come from ./.env on the server (never committed):
#   POSTGRES_PASSWORD, AUTH_TOKEN_SECRET, OPENAI_API_KEY,
#   AWS_S3_BUCKET / AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (PDF storage),
#   PAYSTACK_SECRET_KEY / PAYSTACK_PUBLIC_KEY (when live),
#   DOMAIN (e.g. passpath.co.za — leave unset to serve plain HTTP on :80 via the IP)

services:
  db:
    # pg18 to match the Neon database the data was migrated from.
    image: pgvector/pgvector:pg18
    container_name: passpath-db
    restart: unless-stopped
    # Modest settings for a 1GB-RAM box shared with Node + Redis.
    command: postgres -c shared_buffers=128MB -c max_connections=50
    environment:
      POSTGRES_USER: passpath
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: passpath
    # Loopback only — reachable from the box (and via SSH tunnel), never the internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # db18_data: initialized by pg18 (the original db_data volume was pg16).
      # pg18 images moved the volume mount point up to /var/lib/postgresql.
      - db18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passpath -d passpath"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: passpath-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: passpath-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://passpath:${POSTGRES_PASSWORD}@db:5432/passpath?schema=public
      # Same DB, no pooler — migrations run against it directly.
      DIRECT_URL: postgresql://passpath:${POSTGRES_PASSWORD}@db:5432/passpath?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Past-paper PDFs live in a private S3 bucket, not on the instance disk.
      STORAGE_DRIVER: s3
      AWS_REGION: ${AWS_REGION:-eu-west-2}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:?set AWS_S3_BUCKET in .env}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY in .env}
      # Only needed for S3-compatible stores (e.g. Backblaze B2); empty = real AWS S3.
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-}

  caddy:
    image: caddy:2-alpine
    container_name: passpath-caddy
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      # ":80" = plain HTTP until a real domain is set; Caddy auto-issues TLS once
      # DOMAIN points at this box.
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db18_data:
  redis_data:
  caddy_data:
  caddy_config:
